<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROVAC - Oficial</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #eceff1; padding: 15px; margin: 0; }
        .container { background: #fff; padding: 20px; max-width: 400px; margin: 20px auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #1b5e20; color: #fff; font-weight: bold; border: none; cursor: pointer; }
        label { display: block; margin-top: 15px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h2 style="text-align:center">Manutenção PROVAC</h2>
    <form id="form">
        <input type="text" name="nome" placeholder="Seu Nome" required>
        <label>Data:</label>
        <input type="date" name="data" id="dataAtual" readonly>
        <label>Foto 1:</label>
        <input type="file" id="foto1" accept="image/*" capture="camera" required>
        <label>Foto 2:</label>
        <input type="file" id="foto2" accept="image/*" capture="camera" required>
        <button type="submit" id="btnEnviar">Enviar Relatório</button>
        <p id="status" style="text-align:center; font-size:12px; color: #666;"></p>
    </form>
</div>

<script>
    const SERVICE_ID  = 'service_t57bwhj'; 
    const PUBLIC_KEY  = 'EQu27ao-bGx5zYdtq'; 
    const TEMPLATE_ID = 'template_bd9a51o'; 

    emailjs.init(PUBLIC_KEY);

    // Data automática
    const campo = document.getElementById('dataAtual');
    const d = new Date();
    campo.value = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0];

    async function compress(file) {
        return new Promise((res) => {
            const r = new FileReader();
            r.readAsDataURL(file);
            r.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const max = 500;
                    let w = img.width, h = img.height;
                    if (w > max) { h = Math.round((h * max) / w); w = max; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    res(canvas.toDataURL('image/jpeg', 0.3));
                };
            };
        });
    }

    document.getElementById('form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnEnviar');
        const st = document.getElementById('status');
        
        try {
            btn.disabled = true;
            st.innerText = "Processando fotos...";
            const img1 = await compress(document.getElementById('foto1').files[0]);
            const img2 = await compress(document.getElementById('foto2').files[0]);
            
            st.innerText = "Enviando via Gmail...";
            await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
                nome: this.nome.value,
                data: this.data.value,
                foto1: img1,
                foto2: img2
            });

            alert('Sucesso! Enviado.');
            this.reset();
            st.innerText = "";
        } catch (err) {
            console.error(err);
            alert('Erro: Verifique se o Gmail está RECONECTADO no painel EmailJS.');
            st.innerText = "Falha no envio.";
        } finally {
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
